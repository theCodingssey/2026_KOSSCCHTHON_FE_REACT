# Ice-Link 웹 nginx 설정 (컨테이너 안 /etc/nginx/conf.d/default.conf)
#
#   /            React 정적 파일. 새로고침해도 라우터가 처리하도록 index.html 로 폴백
#   /api/        같은 서버의 백엔드(호스트 8080)로 프록시. SSE 를 위해 버퍼링 끄고 타임아웃을 길게
#   /healthz     컨테이너 헬스체크용

# 백엔드는 host 네트워크로 실행되므로 호스트 게이트웨이 이름으로 접근한다 (docker run --add-host host.docker.internal:host-gateway)
# 이름에 밑줄을 쓰지 않는다: Host 헤더로 전달되면 Tomcat 이 400 으로 거절한다
upstream icelink-backend {
    server host.docker.internal:8080;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 프록시 공통 헤더 (server 레벨에 두어 모든 location 이 상속)
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # keepalive 업스트림을 위해 Connection 헤더 비움 (SSE 도 이 설정으로 동작)
    proxy_set_header Connection "";

    # 텍스트 자산 압축
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml font/woff2;

    # 요청 본문 상한 (답변 텍스트 3000자 + 여유)
    client_max_body_size 1m;

    location = /healthz {
        access_log off;
        return 200 'ok';
        add_header Content-Type text/plain;
    }

    # ---- API 프록시 (REST + SSE) ----
    location /api/ {
        proxy_pass http://icelink-backend;

        # SSE: 이벤트를 모아 보내지 않고 즉시 전달, 하트비트(15초)보다 훨씬 긴 유휴 허용
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;

        # 유저 키가 ?userKey= 로 올 수 있으므로 접근 로그에 쿼리스트링을 남기지 않는다
        access_log /var/log/nginx/api.log api_no_query;
    }

    location = /actuator/health {
        proxy_pass http://icelink-backend/actuator/health;
        access_log off;
    }

    # ---- 정적 자산: 해시 파일명이라 영구 캐시 ----
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- SPA 라우팅 ----
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
